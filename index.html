const PL=['Isu','Isu','Pro','Pro','Pro ⚠','Kontra','Kontra','Kontra','Simpulan'],PT=['Media sosial sudah menjadi bagian dari keseharian remaja. Sebelum berangkat sekolah, saat istirahat, sampai menjelang tidur, remaja sering menghabiskan waktu di depan layar ponsel. Platform seperti TikTok dan Instagram dipakai untuk mencari hiburan, berbagi momen, hingga belajar.','Kebiasaan ini memunculkan perbedaan pendapat. Sebagian orang menilai media sosial memberi banyak manfaat bagi remaja, sedangkan sebagian lain menganggapnya lebih banyak membawa risiko. Apakah media sosial lebih tepat disebut sahabat atau justru jebakan bagi remaja?','Pihak yang setuju berpendapat bahwa media sosial memberi ruang bagi remaja untuk berkreasi. Karya yang dulu hanya dilihat keluarga kini bisa dinikmati banyak orang dan mendapat masukan. Contohnya, remaja yang suka melukis dapat membagikan proses melukisnya lewat video singkat dan bertemu dengan orang-orang yang punya minat sama.','Selain itu, media sosial menjadi sumber belajar yang mudah dijangkau. Banyak akun membagikan penjelasan materi pelajaran, latihan bahasa asing, sampai tips menulis secara gratis. Remaja yang belum bisa ikut bimbingan belajar tetap dapat belajar dari video-video singkat itu.','Ada pula yang berpendapat bahwa remaja yang aktif di media sosial pasti lebih pintar bergaul dan lebih sukses di masa depan. Menurut mereka, semakin sering seseorang mengunggah sesuatu, semakin besar peluangnya berhasil.','Namun, pihak yang tidak setuju menilai media sosial mudah membuat penggunanya kehilangan waktu. Fitur gulir tanpa akhir dan rekomendasi video yang terus muncul membuat pengguna sulit berhenti. Akibatnya, tugas sekolah tertunda dan waktu tidur berkurang, padahal awalnya hanya berniat membuka aplikasi sebentar.','Selain itu, media sosial membuka peluang terjadinya perundungan siber, yaitu perundungan lewat internet. Komentar kasar bisa dikirim oleh siapa saja tanpa bertatap muka, dan pelakunya sering merasa tidak perlu bertanggung jawab. Platform memang menyediakan fitur blokir dan laporkan, tetapi korban sering baru memakainya setelah merasa malu dan takut membuka akunnya lagi.','Kekhawatiran lainnya adalah informasi yang tidak selalu benar. Kabar bohong bisa menyebar cepat karena banyak orang membagikannya sebelum memeriksa sumbernya. Meskipun tampak meyakinkan, tidak semua kabar yang beredar itu benar. Remaja yang belum terbiasa mengecek kebenaran informasi lebih mudah percaya.','Berdasarkan kedua pandangan tersebut, media sosial bisa menjadi sahabat sekaligus jebakan, tergantung pada cara remaja memakainya. Karena itu, remaja perlu membatasi waktu penggunaan, memeriksa kebenaran informasi sebelum membagikannya, dan memakai fitur blokir serta laporkan agar manfaat media sosial tetap terasa tanpa mengabaikan risikonya.'];let showL=false;

const tg=Object.assign({},BASE,D[pn](pt));
if(sp)tg.hx+=.04*Math.sin(now*8);
if(c.hov&&c.pose=='idle'&&!sp){tg.aRz=2.2+.3*Math.sin(now*9);tg.aRx=0;tg.fRx=-.3}
const k=Math.min(1,dt*8),j=c.j;for(const n in tg)j[n]+=(tg[n]-j[n])*k;
c.aL.rotation.set(j.aLx,0,-j.aLz);c.aR.rotation.set(j.aRx,0,j.aRz);c.fL.rotation.x=j.fLx;c.fR.rotation.x=j.fRx;
const ly=Math.max(-.5,Math.min(.5,(mx*7-c.root.position.x)*.07));
c.head.rotation.set(j.hx-my*.1,j.hy+ly*.8,j.hz);
c.pup.forEach(p=>{p.position.x+=(ly*.05-p.position.x)*.2;p.position.y+=(my*.03-p.position.y)*.2});
c.body.scale.y=1+.012*Math.sin(now*2.4+c.ph);c.body.rotation.z=.012*Math.sin(now*1.3+c.ph);
if(now>c.nb){c.bl=now+.12;c.nb=now+2+Math.random()*3.5}
c.eyes.forEach(e=>e.scale.y=now<c.bl?.1:1);
let o=0,w=1;if(sp&&now-c.lt<.12){const v=VIS[c.ch];o=v?v[0]:.3;w=v?v[1]:1}
if(c.fa=='s')o=Math.max(o,.55);if(c.fa=='h'){w*=1.4;o=Math.max(o,.08)}
c.mo+=(o-c.mo)*Math.min(1,dt*30);c.mw+=(w-c.mw)*Math.min(1,dt*20);c.mouth.scale.set(1.4*c.mw,.12+c.mo*1.6,.4+c.mo*.4);
const ang=c.fa=='a'?.35:0,up=c.fa=='s'?.08:0;
c.brw.forEach((b,i)=>{b.rotation.z+=((i?1:-1)*ang-b.rotation.z)*.2;b.position.y+=(.27+up+(sp?.015*Math.sin(now*9):0)-b.position.y)*.2});
c.sw.visible=c.pose=='sweat';if(c.sw.visible)c.sw.position.y=.3-((pt*1.2)%1)*.3;
let hop=0;const rt=now-c.react;if(rt<.7){hop=.3*Math.sin(Math.PI*rt/.7);c.head.rotation.y+=.5*Math.sin(rt*10)*(1-rt/.7)}
c.root.position.y=c.by+hop}
/* kamera sinematik */
let cT={x:0,y:2.1,z:10.6,lx:0,ly:1.7},cc=Object.assign({},cT),cw=0,ch=0,last=performance.now()/1e3;
function loop(){requestAnimationFrame(loop);const now=performance.now()/1e3,dt=Math.min(.05,now-last);last=now;
if(!R.domElement.isConnected){const h=document.getElementById('c3h');if(!h)return;h.appendChild(R.domElement)}
const p=R.domElement.parentNode,w=p.clientWidth,h=p.clientHeight;
if(w&&h&&(w!=cw||h!=ch)){cw=w;ch=h;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
CH.forEach(c=>upd(c,dt,now));

const kk=Math.min(1,dt*3.2);for(const n in cT)cc[n]+=(cT[n]-cc[n])*kk;
cam.position.set(cc.x+mx*.5,cc.y+my*.25,cc.z);cam.lookAt(cc.lx+mx*.2,cc.ly,0);R.render(sc,cam)}
/* interaksi: tatapan mengikuti kursor, sapa saat disentuh, loncat saat diklik */
const rc=new T3.Raycaster();
function pick(){rc.setFromCamera({x:mx,y:my},cam);const h=rc.intersectObjects(CH.filter(c=>c.root.visible).map(c=>c.root),true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.c)o=o.parent;return o?o.userData.c:null}
function setM(e){const r=R.domElement.getBoundingClientRect();if(!r.width)return false;mx=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));my=Math.max(-1,Math.min(1,1-(e.clientY-r.top)/r.height*2));return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
addEventListener('pointermove',e=>{const ins=setM(e),h=ins?pick():null;CH.forEach(c=>c.hov=c==h);R.domElement.style.cursor=h?'pointer':''});
addEventListener('pointerdown',e=>{if(e.target==R.domElement){setM(e);const h=pick();if(h)h.react=performance.now()/1e3}});
/* ganti API panggung lama (SVG) dengan versi 3D; logika game tidak berubah */
window.stage=()=>'<div class="stage"><div class="shaker" id="shk"><div id="c3h"></div></div><div class="fl" id="fl"></div><div class="st" id="st"></div></div><div class="tb" id="tb" onclick="adv()"><span class="nm" id="nm"></span><span id="tx"></span><span class="ar">▼</span></div>';
window.P=(k,po,fa)=>{const c=C3[k];if(!c)return;c.pose=D[po]?po:'idle';c.fa=fa=='a'||fa=='s'||fa=='h'?fa:'';c.t0=performance.now()/1e3};
window.talk=(k,on)=>{const c=C3[k];if(c)c.say=on};
window.resetP=()=>['n','h','g','w'].forEach(k=>P(k,'idle'));
window.cut=s=>{const v=SH[s];if(!v)return;const tx=(v[0]-1)*3.6,cl=v[1]>1.3;cT={x:tx*(cl?.9:.5),y:cl?2.5:2.2,z:cl?5.4:10.6,lx:tx,ly:cl?2.45:1.8}};
loop();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
